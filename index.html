<!DOCTYPE html>
<html>
<head>
    <title>Git Pattern Generator</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 20px;
            line-height: 1.5;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        button, select {
            padding: 8px 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        button:hover, select:hover {
            background: #2ea043;
        }
        
        input, select {
            padding: 5px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #c9d1d9;
        }
        
        .grid-container {
            display: flex;
            align-items: flex-start;
        }
        
        .day-labels {
            display: flex;
            flex-direction: column;
            margin-right: 4px;
            padding-top: 14px;
            color: #8b949e;
            font-size: 12px;
            height: 104px;
        }
        
        .day-label {
            height: 15px;
            line-height: 15px;
        }
        
        .day-label:nth-child(1) { margin-top: 0; }
        .day-label:nth-child(2) { margin-top: 14px; }
        .day-label:nth-child(3) { margin-top: 14px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(53, 13px);
            grid-template-rows: repeat(7, 13px);
            gap: 2px;
        }
        
        .cell {
            width: 11px;
            height: 11px;
            border-radius: 2px;
            border: 1px solid #1b1f24;
            cursor: pointer;
        }
        
        .cell.empty {
            border: none;
            background: transparent;
            cursor: default;
        }
        
        pre {
            margin-top: 20px;
            padding: 16px;
            background: #161b22;
            border-radius: 6px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <label>Year: <input type="number" id="year" /></label>
        <select id="fillLevel">
            <option value="-1">Select fill level...</option>
            <option value="0">None</option>
            <option value="1">Light Green</option>
            <option value="2">Medium Green</option>
            <option value="3">Bright Green</option>
            <option value="4">Brightest Green</option>
        </select>
        <button onclick="applyFill()">Apply Fill</button>
        
        <!-- Pattern controls -->
        <select id="patternSelect">
            <option value="">Select pattern...</option>
            <option value="wave">Wave</option>
            <option value="stars">Stars</option>
            <option value="heart">Heart</option>
            <option value="checkerboard">Checkerboard</option>
            <option value="stripes">Stripes</option>
            <option value="diamond">Diamond</option>
            <option value="zigzag">Zigzag</option>
        </select>
        <button onclick="applyPattern()">Apply Pattern</button>
        
        <button onclick="generateScript()">Generate Script</button>
        <button onclick="copyScript()">Copy to Clipboard</button>
        <button onclick="downloadScript()">Download Script</button>
    </div>
    
    <div class="grid-container">
        <div class="day-labels">
            <div class="day-label">Mon</div>
            <div class="day-label">Wed</div>
            <div class="day-label">Fri</div>
        </div>
        <div id="grid" class="grid"></div>
    </div>
    
    <pre id="output"></pre>

    <script>
        const rows = 7;
        const cols = 53;
        let grid = Array(rows).fill().map(() => Array(cols).fill(0));
        
        function initGrid() {
            const yearInput = document.getElementById('year');
            yearInput.value = new Date().getFullYear();
            updateGrid();
        }
        
        function getColor(clicks) {
            const colors = [
                '#161b22',
                '#0e4429',
                '#006d32',
                '#26a641',
                '#39d353'
            ];
            return colors[clicks];
        }
        
        // Pattern generation function
        function applyPattern() {
            const pattern = document.getElementById('patternSelect').value;
            if (!pattern) return;
            
            // Reset grid
            grid = Array(rows).fill().map(() => Array(cols).fill(0));
            
            switch(pattern) {
                case 'wave':
                    for (let col = 0; col < cols; col++) {
                        const row = Math.floor(3 + Math.sin(col * 0.5) * 2);
                        if (row >= 0 && row < rows) {
                            grid[row][col] = 3;
                        }
                    }
                    break;
                    
                case 'stars':
                    const starPositions = [
                        [1, 5], [5, 5], [3, 10],
                        [2, 15], [4, 15], [1, 20],
                        [5, 20], [3, 25], [2, 30],
                        [4, 30], [1, 35], [5, 35]
                    ];
                    
                    starPositions.forEach(([row, col]) => {
                        if (col < cols && row < rows) {
                            grid[row][col] = 4;
                            // Add surrounding pixels
                            if (row > 0) grid[row-1][col] = 2;
                            if (row < rows-1) grid[row+1][col] = 2;
                            if (col > 0) grid[row][col-1] = 2;
                            if (col < cols-1) grid[row][col+1] = 2;
                        }
                    });
                    break;
                    
                case 'heart':
                    const heart = [
                        [0,4,4,0,4,4,0],
                        [4,4,4,4,4,4,4],
                        [4,4,4,4,4,4,4],
                        [0,4,4,4,4,4,0],
                        [0,0,4,4,4,0,0],
                        [0,0,0,4,0,0,0]
                    ];
                    
                    const startCol = Math.floor(cols/2) - Math.floor(heart[0].length/2);
                    heart.forEach((row, rowIndex) => {
                        row.forEach((val, colIndex) => {
                            if (rowIndex < rows && (startCol + colIndex) < cols) {
                                grid[rowIndex][startCol + colIndex] = val;
                            }
                        });
                    });
                    break;
                    
                case 'checkerboard':
                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col < cols; col++) {
                            if ((row + col) % 2 === 0) {
                                grid[row][col] = 2;
                            }
                        }
                    }
                    break;

                // New pattern: Stripes
                case 'stripes':
                    for (let col = 0; col < cols; col++) {
                        if (col % 3 === 0) {
                            for (let row = 0; row < rows; row++) {
                                grid[row][col] = 3;
                            }
                        }
                    }
                    break;

                // New pattern: Diamond
                case 'diamond':
                    const centerRow = Math.floor(rows/2);
                    const centerCol = Math.floor(cols/2);
                    const size = 10;
                    
                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col < cols; col++) {
                            const distance = Math.abs(row - centerRow) + Math.abs(col - centerCol);
                            if (distance < size) {
                                grid[row][col] = 4 - Math.floor(distance/2);
                            }
                        }
                    }
                    break;

                // New pattern: Zigzag
                case 'zigzag':
                    let currentRow = 0;
                    let direction = 1;
                    
                    for (let col = 0; col < cols; col++) {
                        grid[currentRow][col] = 3;
                        currentRow += direction;
                        
                        if (currentRow >= rows - 1 || currentRow <= 0) {
                            direction *= -1;
                        }
                    }
                    break;
            }
            
            updateGrid();
        }
        
        function applyFill() {
            const fillLevel = parseInt(document.getElementById('fillLevel').value);
            if (fillLevel === -1) return;
            fillAll(fillLevel);
        }
        
        function fillAll(fillLevel) {
            const year = parseInt(document.getElementById('year').value);
            const startDate = new Date(year, 0, 1);
            const firstDayOfWeek = startDate.getDay();
            const lastDayOfYear = new Date(year, 11, 31).getDay();
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (!((col === 0 && row < firstDayOfWeek) || 
                        (col === cols - 1 && row > lastDayOfYear))) {
                        grid[row][col] = fillLevel;
                    }
                }
            }
            updateGrid();
        }

        function toggleCell(row, col) {
            const year = parseInt(document.getElementById('year').value);
            const startDate = new Date(year, 0, 1);
            const firstDayOfWeek = startDate.getDay();
            const lastDayOfYear = new Date(year, 11, 31).getDay();
            
            if ((col === 0 && row < firstDayOfWeek) || (col === cols - 1 && row > lastDayOfYear)) {
                return;
            }
            
            grid[row][col] = (grid[row][col] + 1) % 5;
            updateGrid();
        }
        
        function updateGrid() {
            const gridEl = document.getElementById('grid');
            const year = parseInt(document.getElementById('year').value);
            const startDate = new Date(year, 0, 1);
            const firstDayOfWeek = startDate.getDay();
            const lastDayOfYear = new Date(year, 11, 31).getDay();
            
            gridEl.innerHTML = '';
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.style.gridRow = row + 1;
                    cell.style.gridColumn = col + 1;
                    
                    if ((col === 0 && row < firstDayOfWeek) || (col === cols - 1 && row > lastDayOfYear)) {
                        cell.className = 'cell empty';
                    } else {
                        cell.className = 'cell';
                        cell.style.backgroundColor = getColor(grid[row][col]);
                        cell.onclick = () => toggleCell(row, col);
                        
                        const date = new Date(startDate);
                        date.setDate(date.getDate() + (col * 7) + row - firstDayOfWeek);
                        cell.title = date.toLocaleDateString();
                    }
                    
                    gridEl.appendChild(cell);
                }
            }
        }
        
        function generateScript() {
            const year = document.getElementById('year').value;
            const startDate = new Date(year, 0, 1);
            const firstDayOfWeek = startDate.getDay();
            const lastDayOfYear = new Date(year, 11, 31).getDay();
            
            let script = '#!/bin/bash\n\n';
            
            grid.forEach((row, dayOfWeek) => {
                row.forEach((intensity, week) => {
                    if (intensity > 0 && !((week === 0 && dayOfWeek < firstDayOfWeek) || 
                        (week === cols - 1 && dayOfWeek > lastDayOfYear))) {
                        const date = new Date(startDate);
                        date.setDate(date.getDate() + (week * 7) + dayOfWeek - firstDayOfWeek);
                        
                        for (let i = 0; i < intensity; i++) {
                            const hours = Math.floor(Math.random() * 12) + 9;
                            const minutes = Math.floor(Math.random() * 60);
                            const seconds = Math.floor(Math.random() * 60);
                            
                            const dateString = date.toISOString().split('T')[0];
                            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                            
                            script += `GIT_AUTHOR_DATE="${dateString} ${timeString}" GIT_COMMITTER_DATE="${dateString} ${timeString}" git commit --allow-empty -m "gixel"\n`;
                        }
                    }
                });
            });
            
            script += '\ngit push origin main\n';
            document.getElementById('output').textContent = script;
        }
        
        function copyScript() {
            const output = document.getElementById('output').textContent;
            navigator.clipboard.writeText(output)
                .then(() => alert('Copied to clipboard!'))
                .catch(() => alert('Failed to copy. Please select and copy manually.'));
        }
        
        function downloadScript() {
            const output = document.getElementById('output').textContent;
            const blob = new Blob([output], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'git-commits.sh';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        document.getElementById('year').addEventListener('change', updateGrid)
